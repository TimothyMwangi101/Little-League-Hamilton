services:
  postgres:
    image: postgres:18
    container_name: postgres
    hostname: ${DB_HOST}

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - pgdata:/var/lib/postgresql

    restart: unless-stopped
    network_mode: "host"

volumes:
  pgdata: